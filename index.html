<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NextGen AI – Innovating with Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B14;--tx:#E5E7EB;--v:#7C3AED;--c:#22D3EE;--g:linear-gradient(120deg,#7C3AED,#22D3EE);--card:rgba(255,255,255,.05);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;line-height:1.6;overflow-x:hidden}
h1,h2,h3,.sg{font-family:'Space Grotesk',system-ui,sans-serif}
.mesh{position:fixed;inset:0;z-index:-1;background:var(--bg);overflow:hidden}
.mesh i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.28;animation:drift 26s ease-in-out infinite alternate}
.mesh i:nth-child(1){background:var(--v);top:-20%;left:-15%}
.mesh i:nth-child(2){background:var(--c);bottom:-25%;right:-15%;animation-duration:32s;opacity:.2}
.mesh i:nth-child(3){background:#4c1d95;top:30%;left:35%;animation-duration:38s;opacity:.22}
@keyframes drift{to{transform:translate(12vmax,8vmax) scale(1.15)}}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:10px 5vw;background:rgba(11,11,20,.65);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.07)}
nav .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem}
nav img{width:38px;height:38px;border-radius:50%}
.btn{position:relative;overflow:hidden;border:0;cursor:pointer;color:#fff;font:700 1rem 'Space Grotesk',sans-serif;padding:12px 26px;border-radius:999px;background:var(--g);animation:pulse 2.4s ease-in-out infinite}
.btn.sm{padding:9px 20px;font-size:.92rem}
@keyframes pulse{0%,100%{box-shadow:0 0 14px rgba(124,58,237,.5)}50%{box-shadow:0 0 30px rgba(34,211,238,.7)}}
.btn .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rip .6s linear;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
:focus-visible{outline:2px solid var(--c);outline-offset:3px}
section{padding:90px 5vw;max-width:1100px;margin:0 auto}
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;position:relative;max-width:none;padding-top:110px}
#net{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero>*{max-width:900px}
.hero h1{font-size:clamp(2.6rem,9vw,5.6rem);line-height:1.02;margin:0 0 20px;font-weight:700}
.hero h1 span.l{display:inline-block;opacity:0;transform:translateY(40px);animation:up .6s forwards}
.sh{background:linear-gradient(100deg,var(--v),var(--c),#fff,var(--c),var(--v));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 3.5s linear infinite}
@keyframes shim{to{background-position:-250% 0}}
@keyframes up{to{opacity:1;transform:none}}
.hero p{font-size:1.1rem;color:#c7cad3;max-width:620px;margin:0 0 26px}
.words{display:flex;flex-wrap:wrap;gap:6px 22px;font:700 1.15rem 'Space Grotesk';position:relative;padding-bottom:12px;width:max-content;max-width:100%}
.words span{opacity:0;animation:up .6s forwards}
.words span+span{border-left:1px solid rgba(255,255,255,.3);padding-left:22px}
.words::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--g);box-shadow:0 0 14px var(--c);border-radius:3px;animation:ul 1.2s 3.2s forwards}
@keyframes ul{to{width:100%}}
.hero .btn{margin-top:30px;align-self:flex-start}
h2{font-size:clamp(1.8rem,5vw,2.8rem);margin:0 0 34px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{position:relative;background:var(--card);backdrop-filter:blur(12px);border-radius:18px;padding:28px 24px;transition:transform .15s,box-shadow .3s;transform-style:preserve-3d;will-change:transform}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:var(--g);opacity:.35;transition:opacity .3s;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.card:hover{box-shadow:0 0 34px rgba(124,58,237,.35)}
.card:hover::before{opacity:1}
.card h3{margin:14px 0 0;font-size:1.15rem}
.ic{width:46px;height:46px;border-radius:12px;background:var(--g);display:grid;place-items:center;font-size:1.3rem}
.rv{opacity:0;transform:translateY(34px);transition:opacity .7s,transform .7s}
.rv.in{opacity:1;transform:none}
.move{text-align:center}
.move .card{padding:44px 28px;max-width:760px;margin:0 auto}
.move p{font-size:1.25rem;margin:0}
ul.ck{list-style:none;padding:0;margin:0}
ul.ck li{display:flex;gap:12px;align-items:flex-start;padding:8px 0}
ul.ck li::before{content:"✓";flex:none;width:24px;height:24px;border-radius:50%;background:var(--g);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:#fff;margin-top:2px}
.mq{overflow:hidden;mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);-webkit-mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.track{display:flex;gap:16px;width:max-content;animation:mq 28s linear infinite}
.mq:hover .track{animation-play-state:paused}
.chip{padding:14px 28px;border-radius:14px;background:var(--card);border:1px solid rgba(255,255,255,.1);font:700 1.1rem 'Space Grotesk';white-space:nowrap}
@keyframes mq{to{transform:translateX(-50%)}}
.price{max-width:460px;margin:0 auto;text-align:center}
.price .amt{font:700 3.6rem 'Space Grotesk';line-height:1}
.price .sub{color:#9ca3af;margin:6px 0 20px}
.price ul.ck{text-align:left;margin-bottom:26px}
footer{border-top:1px solid rgba(255,255,255,.08);padding:40px 5vw;text-align:center}
footer img{width:64px;height:64px;border-radius:50%}
footer p{margin:10px 0 14px;color:#9ca3af}
footer a{color:var(--tx);margin:0 12px;text-decoration:none;font-size:.95rem}
footer a:hover{color:var(--c)}
.ov{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(5,5,12,.75);backdrop-filter:blur(6px)}
.ov.on{display:flex}
.md{position:relative;width:100%;max-width:400px;max-height:100%;overflow:auto;text-align:center;background:rgba(18,18,32,.9);border-radius:22px;padding:26px 22px;animation:pop .35s cubic-bezier(.2,1.2,.4,1)}
.md::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:var(--g);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
@keyframes pop{from{opacity:0;transform:scale(.88) translateY(20px)}}
.md h3{margin:0 0 4px;font-size:1.4rem}
.md .qr{background:#fff;border-radius:16px;padding:12px;margin:16px auto 14px;width:min(100%,300px)}
.md .qr img{display:block;width:100%;height:auto}
.md small{color:#9ca3af;display:block}
.x{position:absolute;top:10px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:var(--tx);font-size:1.2rem;cursor:pointer;z-index:2}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.hero h1 span.l,.words span,.rv{opacity:1;transform:none}.words::after{width:100%}.sh{color:var(--c);background:none}.track{flex-wrap:wrap;width:auto}}

.mesh{background:radial-gradient(ellipse at 50% 0%,#1d1038 0%,#0B0B14 62%)}
.mesh::before,.mesh::after{content:"";position:absolute;left:-20%;right:-20%;height:45%;filter:blur(60px);opacity:.33;mix-blend-mode:screen;animation:aur 18s ease-in-out infinite alternate}
.mesh::before{top:6%;background:linear-gradient(90deg,transparent,#22D3EE 25%,#7C3AED 58%,transparent);transform:skewY(-8deg)}
.mesh::after{top:40%;background:linear-gradient(90deg,transparent,#7C3AED 30%,#22D3EE 70%,transparent);transform:skewY(6deg);animation-duration:25s;animation-delay:-9s;opacity:.2}
@keyframes aur{to{transform:translateX(9%) skewY(-3deg) scaleY(1.3);opacity:.5}}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.rune{position:fixed;left:50%;top:50%;width:min(135vmin,1150px);height:auto;translate:-50% -50%;z-index:-1;opacity:.2;pointer-events:none;animation:spin 150s linear infinite;filter:drop-shadow(0 0 8px #22D3EE)}
@keyframes spin{to{rotate:360deg}}
.medal{position:absolute;right:7vw;top:50%;translate:0 -42%;width:310px;height:310px;display:none}
@media(min-width:960px){.medal{display:block}}
.medal::before{content:"";position:absolute;inset:-16px;border-radius:50%;background:conic-gradient(#7C3AED,#22D3EE,#7C3AED);filter:blur(22px);opacity:.65;animation:spin 8s linear infinite}
.medal img{position:relative;width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.14);animation:flt 6s ease-in-out infinite alternate}
@keyframes flt{to{transform:translateY(-16px)}}
h2{position:relative;padding-bottom:16px}
h2::after{content:"";position:absolute;left:0;bottom:0;width:64px;height:3px;border-radius:3px;background:var(--g);box-shadow:0 0 12px var(--c)}
.move h2::after{left:50%;translate:-50% 0}
.card{background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.025));box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 12px 40px rgba(0,0,0,.35)}
.ic{box-shadow:0 0 24px rgba(124,58,237,.6)}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
.price::before{background:conic-gradient(from var(--a),#7C3AED,#22D3EE,#7C3AED);opacity:1;padding:2px;animation:ang 5s linear infinite}
@keyframes ang{to{--a:360deg}}
.price{box-shadow:0 0 70px rgba(124,58,237,.3),inset 0 1px 0 rgba(255,255,255,.12)}
nav{box-shadow:0 8px 30px rgba(0,0,0,.35)}

.hero h1{font-size:clamp(2.7rem,12vw,6rem);line-height:1.02}
.tl{display:block;font-size:.36em;letter-spacing:.42em;color:#c7cad3;margin-bottom:.2em}
.bl{display:block;white-space:nowrap}
.bl .w,.tl .w{display:inline-block}
.bl .w{margin-right:.22em}
.hero h1 span.l.ai{background:linear-gradient(100deg,#7C3AED,#22D3EE,#fff,#22D3EE,#7C3AED);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:up .6s forwards,shim 3.5s linear infinite}
.hero h1{filter:drop-shadow(0 0 28px rgba(124,58,237,.45))}
.medal{position:relative;right:auto;top:auto;translate:none;width:112px;height:112px;display:block;margin:0 0 26px}
@media(min-width:960px){.medal{position:absolute;right:7vw;top:50%;translate:0 -42%;width:310px;height:310px;margin:0}}
.words{gap:8px}
.words span,.words span+span{padding:6px 12px;border-radius:999px;font-size:.88rem;background:rgba(255,255,255,.06);border:1px solid rgba(124,58,237,.55);box-shadow:0 0 14px rgba(124,58,237,.25)}
.words span:last-child{border-color:#22D3EE;color:#22D3EE;box-shadow:0 0 16px rgba(34,211,238,.35)}
@media(min-width:700px){.words span,.words span+span{font-size:1.05rem;padding:8px 20px}}
.ic{width:54px;height:54px;border-radius:16px;box-shadow:0 0 26px rgba(124,58,237,.6),inset 0 1px 0 rgba(255,255,255,.35)}
.ic svg{width:27px;height:27px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.grid .card{overflow:hidden}
.grid .card::after{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(34,211,238,.8),transparent);opacity:.6}
.card:active{transform:scale(.98)}
@media(max-width:640px){
section{padding:64px 5vw}
.grid{grid-template-columns:1fr 1fr;gap:12px}
.grid .card{padding:22px 12px;text-align:center}
.grid .ic{margin:0 auto}
.grid .card h3{font-size:.95rem;margin-top:14px;line-height:1.3}
.move .card{padding:30px 20px}
.move p{font-size:1.05rem}
h2{margin-bottom:26px}
}
</style>
</head>
